<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>JS Pokédex</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                font-family: sans-serif;
                padding: 24px;
                background: #f5f5f5;
            }
            input {
                padding: 10px;
                width: 100%;
                margin-bottom: 20px;
                font-size: 16px;
                border-radius: 8px;
                border: 1px solid #ddd;
            }
            #grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 16px;
            }
            .card {
                background: white;
                border-radius: 12px;
                padding: 16px;
                text-align: center;
                cursor: pointer;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            }
            .card img {
                width: 80px;
                height: 80px;
            }
            .card h3 {
                margin: 8px 0 4px;
                text-transform: capitalize;
                font-size: 14px;
            }
            .card p {
                font-size: 12px;
                color: #888;
            }

            /* HTML: <div class="loader"></div> */
            .loader {
                width: 45px;
                aspect-ratio: 1;
                --c: no-repeat linear-gradient(#000 0 0);
                background:
                    var(--c) 0% 50%,
                    var(--c) 50% 50%,
                    var(--c) 100% 50%;
                background-size: 20% 100%;
                animation: l1 1s infinite linear;
            }
            @keyframes l1 {
                0% {
                    background-size:
                        20% 100%,
                        20% 100%,
                        20% 100%;
                }
                33% {
                    background-size:
                        20% 10%,
                        20% 100%,
                        20% 100%;
                }
                50% {
                    background-size:
                        20% 100%,
                        20% 10%,
                        20% 100%;
                }
                66% {
                    background-size:
                        20% 100%,
                        20% 100%,
                        20% 10%;
                }
                100% {
                    background-size:
                        20% 100%,
                        20% 100%,
                        20% 100%;
                }
            }
            dialog {
                border: none;
                padding: 0;
                border-radius: 20px;
                width: 340px;
                overflow: hidden;
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
                margin: auto;
            }

            dialog::backdrop {
                background: rgba(0, 0, 0, 0.6);
                backdrop-filter: blur(4px);
            }

            /* header banner */
            .dialog-header {
                background: #cc0000;
                padding: 1.25rem 1.25rem 2.5rem;
                position: relative;
            }
            .dialog-header h2 {
                color: #fff;
                font-size: 20px;
                text-transform: capitalize;
                margin: 0;
            }
            .dialog-sprite {
                position: absolute;
                right: 1rem;
                top: 0.5rem;
                height: 100px;
            }

            /* body */
            .dialog-body {
                padding: 1rem 1.25rem;
                display: flex;
                flex-direction: column;
                gap: 15px;
            }

            /* type badges */
            .type-badge {
                font-size: 11px;
                font-weight: 600;
                padding: 3px 10px;
                border-radius: 20px;
                text-transform: uppercase;
                background-color: #9996;
            }

            .type-row,
            .abilities-row {
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
            }

            /* stat cards */
            .stats-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }
            .stat-card {
                background: #5553;
                border-radius: 10px;
                padding: 10px 12px;
            }

            /* ability chips */
            .ability-chip {
                background: #adefc3;
                color: #166534;
                font-size: 12px;
                padding: 4px 10px;
                border-radius: 20px;
                text-transform: capitalize;
            }
            .poke-id {
                margin-bottom: 5px;
                color: #fff;
            }
            .abilities-label {
                margin-bottom: 5px;
            }

            /* open animation */
            dialog[open] {
                animation: pop-in 0.2s ease;
            }
            dialog.loading {
                padding: 20px;
                .dialog-content {
                    display: flex;
                    justify-content: center;
                }
                .dialog-footer {
                    display: none;
                }
            }
            @keyframes pop-in {
                from {
                    opacity: 0;
                    transform: scale(0.95) translateY(8px);
                }
                to {
                    opacity: 1;
                    transform: scale(1) translateY(0);
                }
            }
            .type-water {
                background: #dbeafe;
                color: #1e40af;
            }
            .type-grass {
                background: #dcfce7;
                color: #166534;
            }
            .type-electric {
                background: #fef9c3;
                color: #854d0e;
            }
            .type-psychic {
                background: #fce7f3;
                color: #9d174d;
            }
            .type-ice {
                background: #e0f2fe;
                color: #0369a1;
            }
            .type-dragon {
                background: #ede9fe;
                color: #5b21b6;
            }
            .dialog-footer {
                display: flex;
                flex-direction: row-reverse;
                button {
                    background: #cc0000;
                    border: none;
                    color: white;
                    padding: 5px 8px;
                }
            }
        </style>
    </head>
    <body>
        <h1>JS Pokédex</h1>
        <input id="search" type="text" placeholder="Search Pokémon..." />
        <div id="grid"></div>
        <dialog id="pokedetails">
            <div id="dialog-content"></div>
            <div class="dialog-footer">
                <button id="closeButton">Close</button>
            </div>
        </dialog>
        <script type="module" src="/src/main.js"></script>
    </body>
</html>
