<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>JS Pokédex</title>
        <style>
            body {
                font-family: sans-serif;
                padding: 24px;
                background: #f5f5f5;
            }
            input {
                padding: 10px;
                width: 100%;
                margin-bottom: 20px;
                font-size: 16px;
                border-radius: 8px;
                border: 1px solid #ddd;
            }
            #grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 16px;
            }
            .card {
                background: white;
                border-radius: 12px;
                padding: 16px;
                text-align: center;
                cursor: pointer;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            }
            .card img {
                width: 80px;
                height: 80px;
            }
            .card h3 {
                margin: 8px 0 4px;
                text-transform: capitalize;
                font-size: 14px;
            }
            .card p {
                font-size: 12px;
                color: #888;
            }
        </style>
    </head>
    <body>
        <h1>JS Pokédex</h1>
        <input id="search" type="text" placeholder="Search Pokémon..." />
        <div id="grid"></div>
        <script type="module" src="/src/main.js"></script>
    </body>
</html>
